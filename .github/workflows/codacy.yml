name: Go Security Scan

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 0 * * 0' # Run weekly on Sundays
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write
  security-events: write # Required to post alerts into GitHub Security -> Code scanning

jobs:
  security-inspection:
    name: Go Security Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 1. Check dependencies for known CVEs using Go's official scanner
      - name: Run govulncheck
        if: always()
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck -json ./... > govulncheck-results.json 2>&1 || true

      # 2. AST Static Code Security Scan (hardcoded credentials, SQLi, weak crypto, unsafe blocks)
      - name: Run Gosec Security Scanner
        if: always()
        continue-on-error: true
        uses: securego/gosec@master
        with:
          args: '-fmt=json -out=gosec-results.json -severity=low -confidence=low ./...'

      # 2b. Run Gosec Security Scanner for SARIF export
      - name: Run Gosec Security Scanner (SARIF)
        if: always()
        continue-on-error: true
        uses: securego/gosec@master
        with:
          args: '-fmt=sarif -out=gosec-results.sarif -severity=low -confidence=low ./...'

      # 3. Upload Gosec results to GitHub Security tab (visible on PRs and repo dashboard)
      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@v3
        if: always() # Ensures report uploads even if gosec detects vulnerabilities
        with:
          sarif_file: gosec-results.sarif

      # 4. Process scan outputs, aggregate findings, and create GitHub Issues with 'jules' label
      - name: Process Security Alerts and Dispatch to Jules
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/process_security_results.py gosec-results.json govulncheck-results.json

