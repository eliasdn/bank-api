name: Go Security Scan

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 0 * * 0' # Run weekly on Sundays

permissions:
  contents: read
  security-events: write # Required to post alerts into GitHub Security -> Code scanning

jobs:
  security-inspection:
    name: Go Security Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      # 1. Check dependencies for known CVEs using Go's official scanner
      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-package: './...'

      # 2. AST Static Code Security Scan (hardcoded credentials, SQLi, weak crypto, unsafe blocks)
      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: '-fmt=sarif -out=gosec-results.sarif -severity=medium -confidence=medium ./...'

      # 3. Upload Gosec results to GitHub Security tab (visible on PRs and repo dashboard)
      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@v3
        if: always() # Ensures report uploads even if gosec detects vulnerabilities
        with:
          sarif_file: gosec-results.sarif
