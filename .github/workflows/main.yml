name: Auto-Approve Jules PRs
on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: write
  
jobs:
  auto-merge:
    if: github.actor == 'eliasdn' || 'google-labs-jules[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Auto-merge PR
        run: gh pr merge ${{ github.event.pull_request.html_url }} --auto --merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
